- name: Run PostgreSQL container
  docker_container:
    name: database
    image: mellou/tp-devops-database:latest
    pull: true
    recreate: true
    force_kill: true
    state: started
    restart_policy: always
    env:
      POSTGRES_USER: "{{ db_user }}"
      POSTGRES_PASSWORD: "{{ db_password }}"
    networks:
      - name: my-network
